<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo AI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <h1 class="mb text-center">Thông tin đăng ký</h1>
    <form>
      <div class="form-group">
        <div class="container">
          <div class="row mb-4">
            <div class="col-md-6">
              <label for="first-name">Tên</label>
              <input
                id="first-name"
                type="text"
                name="first-name"
                class="form-control"
                placeholder="John"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="last-name">Họ</label>
              <input
                id="last-name"
                type="text"
                name="last-name"
                class="form-control"
                placeholder="Smith"
                required
              />
            </div>
          </div>
          <div class="row mb-4">
            <div class="col-md">
              <label for="username">Tên đăng nhập</label>
              <input
                id="username"
                type="text"
                name="username"
                class="form-control"
                required
              />
            </div>
          </div>
          <div class="row mb-4">
            <div class="col-md">
              <label for="email">Email</label>
              <input
                id="email"
                type="email"
                name="email"
                class="form-control"
                required
              />
            </div>
          </div>
          <div class="row mb-4">
            <div class="col-md">
              <label for="password">Mật khẩu</label>
              <input
                id="password"
                type="password"
                name="password"
                class="form-control"
                required
              />
            </div>
          </div>
          <div class="row mb-4">
            <div class="col-md-3">
              <label for="birthday">Ngày tháng năm sinh</label>
              <input
                id="birthday"
                type="date"
                name="birthday"
                class="form-control"
                required
              />
            </div>
            <div class="col-md-3">
              <label for="phone">Số điện thoạt</label>
              <input
                id="phone"
                type="tel"
                name="phone"
                class="form-control"
                placeholder="0906-45-36-78"
              />
            </div>
            <div class="col-md-3">
              <label for="address">Địa chỉ</label>
              <input
                type="text"
                id="address"
                name="address"
                class="form-control"
                required
              />
            </div>
            <div class="col-md-3">
              <label for="citizenship">CCCD</label>
              <input
                type="text"
                id="citizenship"
                name="citizenship"
                class="form-control"
                placeholder="077 213 000 123"
                required
              />
            </div>
          </div>
          <div class="row mt-5 mb-2 h4">
            <div>Hỗ trợ AI</div>
          </div>
          <div class="row mb-2">
            <div class="col-md-2 mt-2 mb-4 h6">Nhận diện giọng nói</div>
            <div class="col">
              <button type="button" class="btn btn-dark" id="record-button">
                <i></i>
              </button>
              <p id="record-status"></p>
            </div>
          </div>
          <div class="row mb-2">
            <div class="col" id="transcription"></div>
          </div>
          <div class="row mb-4 mt-2">
            <div class="col-md-3">
              <label for="image" class="form-labe h6"
                >Hình ảnh thông tin cá nhân</label
              >
              <input type="file" id="image" class="form-control" />
            </div>
          </div>
        </div>
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-primary btn-lg">Đăng ký</button>
      </div>
    </form>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="/static/js/script.js"></script>
  </body>
</html>
