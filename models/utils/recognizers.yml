recognizers:
  - name: "Vietnamese Phone Recognizer"
    supported_language: "en"
    patterns:
      - name: "phone_pattern"
        regex: "\\b0\\d{3}\\s\\d{2}\\s\\d{2}\\s\\d{2}\\b"
        score: 0.85
    context:
      - phone
    supported_entity: "VN_PHONE"

  - name: "Vietnamese ID Recognizer"
    supported_language: "en"
    patterns:
      - name: "id_pattern"
        regex: "\\b\\d{3}\\s?\\d{3}\\s?\\d{3}\\s?\\d{3}\\b"
        score: 0.85
    context:
      - ID
      - Citizenship
    supported_entity: "VN_ID"
