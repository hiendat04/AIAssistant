recognizers:
  - name: "Vietnamese Phone Recognizer"
    supported_language: "en"
    patterns:
      - name: "phone_pattern"
        regex: "\\b(?:\\+84|0084|0)\\s?(3[2-9]|5[6|8|9]|7[06-9]|8[1-5]|9[0-9])\\s?\\d{3}\\s?\\d{4}\\b"
        score: 0.85
    context:
      - phone
    supported_entity: "VN_PHONE"

  - name: "Vietnamese ID Recognizer"
    supported_language: "en"
    patterns:
      - name: "id_pattern"
        regex: "\\b0\\d{2}\\s?\\d{3}\\s?\\d{3}\\s?\\d{3}\\b"
        score: 0.85
    context:
      - id
    supported_entity: "VN_ID"
